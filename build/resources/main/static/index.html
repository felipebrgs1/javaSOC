<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord Clone — Phase 1 (1:1 Chat PoC)</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px; background: #1e1f22; color: #dcddde; }
        h1 { margin: 0 0 20px; font-size: 18px; }
        .row { display: flex; gap: 20px; }
        .panel { flex: 1; background: #2b2d31; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; min-width: 0; }
        .panel h2 { margin: 0 0 12px; font-size: 14px; color: #b5bac1; text-transform: uppercase; letter-spacing: 0.5px; }
        .status { font-size: 12px; margin-bottom: 10px; }
        .status.online { color: #23a55a; }
        .status.offline { color: #f23f43; }
        label { display: block; font-size: 12px; color: #b5bac1; margin: 8px 0 4px; }
        input, button { font: inherit; padding: 8px 10px; border-radius: 4px; border: 1px solid #1e1f22; background: #1e1f22; color: #dcddde; }
        input:focus { outline: 1px solid #5865f2; }
        button { background: #5865f2; border: none; color: white; cursor: pointer; padding: 8px 14px; }
        button:hover { background: #4752c4; }
        button:disabled { background: #4e5058; cursor: not-allowed; }
        .row-form { display: flex; gap: 8px; margin-top: 8px; }
        .row-form input { flex: 1; }
        .log { background: #1e1f22; border-radius: 4px; padding: 10px; height: 300px; overflow-y: auto; font-family: "SF Mono", Menlo, monospace; font-size: 12px; margin-top: 10px; }
        .log .in  { color: #23a55a; }
        .log .out { color: #5865f2; }
        .log .err { color: #f23f43; }
    </style>
</head>
<body>
<h1>Discord Clone — Phase 1: 1:1 chat over WebSocket</h1>
<div class="row">
    <div class="panel" id="panel-a">
        <h2>User A</h2>
        <div class="status offline" id="status-a">disconnected</div>
        <label>User id</label>
        <input id="user-a" value="alice">
        <div class="row-form">
            <button id="connect-a">Connect</button>
            <button id="disconnect-a" disabled>Disconnect</button>
        </div>
        <label>Send to</label>
        <input id="to-a" value="bob">
        <label>Message</label>
        <div class="row-form">
            <input id="msg-a" placeholder="Type a message…">
            <button id="send-a" disabled>Send</button>
        </div>
        <div class="log" id="log-a"></div>
    </div>
    <div class="panel" id="panel-b">
        <h2>User B</h2>
        <div class="status offline" id="status-b">disconnected</div>
        <label>User id</label>
        <input id="user-b" value="bob">
        <div class="row-form">
            <button id="connect-b">Connect</button>
            <button id="disconnect-b" disabled>Disconnect</button>
        </div>
        <label>Send to</label>
        <input id="to-b" value="alice">
        <label>Message</label>
        <div class="row-form">
            <input id="msg-b" placeholder="Type a message…">
            <button id="send-b" disabled>Send</button>
        </div>
        <div class="log" id="log-b"></div>
    </div>
</div>

<script>
    function makeClient(side) {
        const statusEl = document.getElementById('status-' + side);
        const logEl    = document.getElementById('log-' + side);
        const userEl   = document.getElementById('user-' + side);
        const toEl     = document.getElementById('to-' + side);
        const msgEl    = document.getElementById('msg-' + side);
        const connectBtn    = document.getElementById('connect-' + side);
        const disconnectBtn = document.getElementById('disconnect-' + side);
        const sendBtn       = document.getElementById('send-' + side);

        let ws = null;

        function log(direction, text, cls) {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = cls || direction;
            div.textContent = `[${time}] ${direction === 'in' ? '←' : '→'} ${text}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(connected) {
            statusEl.textContent = connected ? 'connected' : 'disconnected';
            statusEl.className = 'status ' + (connected ? 'online' : 'offline');
            connectBtn.disabled = connected;
            disconnectBtn.disabled = !connected;
            sendBtn.disabled = !connected;
        }

        function send(obj) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const text = JSON.stringify(obj);
            ws.send(text);
            log('out', text);
        }

        connectBtn.addEventListener('click', () => {
            const userId = userEl.value.trim();
            if (!userId) return;
            ws = new WebSocket('ws://' + location.host + '/ws/chat');
            ws.onopen = () => {
                setStatus(true);
                send({ type: 'CONNECT', from: userId });
            };
            ws.onmessage = (ev) => {
                let parsed;
                try { parsed = JSON.parse(ev.data); } catch { return; }
                log('in', ev.data, parsed.type === 'ERROR' ? 'err' : 'in');
            };
            ws.onclose = () => setStatus(false);
            ws.onerror = () => log('err', 'WebSocket error', 'err');
        });

        disconnectBtn.addEventListener('click', () => {
            if (ws) ws.close();
        });

        sendBtn.addEventListener('click', () => {
            const to = toEl.value.trim();
            const content = msgEl.value.trim();
            if (!to || !content) return;
            send({ type: 'DIRECT_MESSAGE', to, content });
            msgEl.value = '';
        });

        msgEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    }

    makeClient('a');
    makeClient('b');
</script>
</body>
</html>

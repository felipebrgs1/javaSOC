spring:
  application:
    name: discord-clone
  jackson:
    default-property-inclusion: non_null

  # --- Dev profile (default): H2 in-memory, no setup needed. ---
  # To switch to PostgreSQL, change the URL/driver and set
  #   spring.jpa.hibernate.ddl-auto: validate
  # (Flyway/Liquibase migrations will land in a later phase).
  datasource:
    url: jdbc:h2:mem:discordclone;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.felipeb.discordclone: INFO
    org.hibernate.SQL: INFO

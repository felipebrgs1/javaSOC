spring:
  application:
    name: discord-clone
  jackson:
    default-property-inclusion: non_null

  # --- Dev profile (default): H2 in-memory, no setup needed. ---
  # To switch to PostgreSQL, change the URL/driver and set
  #   spring.jpa.hibernate.ddl-auto: validate
  # (Flyway/Liquibase migrations will land in a later phase).
  datasource:
    url: jdbc:h2:mem:discordclone;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  jwt:
    # 32+ bytes required for HS256. Override via APP_JWT_SECRET env var in prod.
    secret: ${APP_JWT_SECRET:dev-only-secret-do-not-use-in-prod-please-rotate-me-now-32b}
    # 7 days
    expiration-ms: 604800000
  bootstrap:
    # Default server every new user is auto-joined to as MEMBER.
    default-server: discord-clone
    # Comma-separated; injected as List<String> via SpEL split.
    default-channels: general,random,dev

logging:
  level:
    com.felipeb.discordclone: INFO
    org.hibernate.SQL: INFO
